name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MouseMapper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MouseMapper-APK
          path: MouseMapper.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: محاكي ماوس - نسخة ${{ github.run_number }}
          body: حمّل ملف MouseMapper.apk من الأسفل وثبّته على هاتفك.
          files: MouseMapper.apk
          make_latest: true
